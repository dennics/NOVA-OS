# NOVA creates the local account during installation, before first login.
# Fedora Kinoite inherits KDE's hidden account/date pages; override those lists.
[User Interface]
hidden_spokes =
    NetworkSpoke
    PasswordSpoke
hidden_webui_pages =
# Match the explicitly installed browser rather than inheriting a profile default.
webui_web_engine = slitherer
can_change_root = False
can_change_users = True

[Security]
selinux = 1

# Keep persistent data in bootc's stateroot. Separate /var and /home requests
# inherit Kinoite's layout but conflict with Anaconda 44's bootc mount setup.
# Anaconda adds the platform-required boot/EFI partitions independently.
[Storage]
default_scheme = PLAIN
file_system_type = ext4
default_partitioning =
    / (min 8 GiB)

# Anaconda loads conf.d after its distribution profile. An empty provider makes
# GeolocationTask return immediately without a network lookup; startup may still
# log "Geolocation is enabled" before the task reads this setting.
[Timezone]
geolocation_provider =

[Localization]
use_geolocation = False
